<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal Escolar de Notícias{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;color:#202833;margin:0}
    header{background:#173b57;color:white;padding:20px 7%}
    header a{color:white;text-decoration:none;margin-right:18px}
    main{max-width:950px;margin:30px auto;padding:0 18px}
    .card{background:white;padding:22px;border-radius:10px;margin:14px 0;box-shadow:0 2px 8px #00000010}
    a,button{cursor:pointer} .btn{display:inline-block;padding:9px 14px;border-radius:6px;background:#176b87;color:white;text-decoration:none;border:0}
    .danger{background:#b52d3a}.secondary{background:#66727d}
    input{padding:10px;width:min(100%,420px);box-sizing:border-box;border:1px solid #b9c2ca;border-radius:5px}
    label{display:block;margin:10px 0 5px} .errorlist{color:#b00020}
    .messages{list-style:none;padding:0}.messages li{padding:12px;border-radius:6px;margin:8px 0}
    .success{background:#d9f2e2;color:#14532d}.error{background:#fde2e2;color:#842029}
    .warning{background:#fff1c2;padding:12px;border-radius:6px}
    table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4e8eb}
  </style>
</head>
<body>
<header>
  <h1>Portal Escolar de Notícias</h1>
  <nav><a href="{% url 'home' %}">Início</a><a href="{% url 'categoria_lista' %}">Categorias</a><a href="{% url 'tag_lista' %}">Tags</a><a href="/admin/">Administração</a></nav>
</header>
<main>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
