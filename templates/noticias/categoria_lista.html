{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div class="card"><h2>Categorias</h2><a class="btn" href="{% url 'categoria_criar' %}">Nova categoria</a>
<table><tr><th>Nome</th><th>Ações</th></tr>
{% for categoria in categorias %}<tr><td>{{ categoria.nome }}</td><td><a href="{% url 'categoria_editar' categoria.pk %}">Editar</a> · <a href="{% url 'categoria_excluir' categoria.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="2">Nenhuma categoria cadastrada.</td></tr>{% endfor %}
</table></div>
{% endblock %}
