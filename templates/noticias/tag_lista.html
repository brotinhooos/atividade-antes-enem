{% extends "base.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
<div class="card"><h2>Tags</h2><a class="btn" href="{% url 'tag_criar' %}">Nova tag</a>
<table><tr><th>Nome</th><th>Ações</th></tr>
{% for tag in tags %}<tr><td>{{ tag.nome }}</td><td><a href="{% url 'tag_editar' tag.pk %}">Editar</a> · <a href="{% url 'tag_excluir' tag.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="2">Nenhuma tag cadastrada.</td></tr>{% endfor %}
</table></div>
{% endblock %}
